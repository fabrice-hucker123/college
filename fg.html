<!DOCTYPE html>
<html>
<head>
  <title>Current Time Footer</title>

  <style>
    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 15px;
      font-family: Arial, sans-serif;
      position: fixed;
      bottom: 0;
      width: 100%;
    }

    #time {
      color: cyan;
      margin-top: 5px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <footer>
    <p>Current Time</p>
    <div id="time"></div>
  </footer>

  <script>
   function updateTime() {
      const now = new Date();
      document.getElementById('time').innerText = now.toLocaleTimeString();
    }

    updateTime();
    setInterval(updateTime, 1000);
  
  </script>

</body>
</html>
